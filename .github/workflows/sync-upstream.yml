name: Upstream Sync

# Compatibility shim for this fork.
# The real mirror logic lives in auto-sync-upstream.yml.
# We intentionally keep NO schedule here so upstream's fragile daily job
# cannot keep failing after each hard-reset mirror.

permissions:
  contents: read
  actions: write

on:
  workflow_dispatch:
    inputs:
      confirm_breaking_update:
        description: "Compatibility no-op for upstream UI parity / 兼容上游手动入口（实际转调 auto-sync-upstream）"
        required: false
        default: true
        type: boolean

concurrency:
  group: upstream-sync-${{ github.repository }}
  cancel-in-progress: false

jobs:
  redirect_to_auto_sync:
    name: Redirect to hardened auto-sync
    runs-on: ubuntu-latest
    if: ${{ github.event.repository.fork }}
    steps:
      - name: Trigger auto-sync-upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "Official Upstream Sync is superseded on this fork."
          echo "Dispatching auto-sync-upstream instead..."
          gh workflow run auto-sync-upstream.yml --repo "${GITHUB_REPOSITORY}" --ref main
          echo "Dispatched. Check the auto-sync-upstream workflow runs for result."
